name: CI
on: [push, pull_request]
jobs:
  permissions:
    runs-on: ubuntu-latest
    env:
      NEXTAUTH_SECRET: ci-only-not-a-deployment-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx prisma generate
      - run: npm test
      - run: npm run type-check
